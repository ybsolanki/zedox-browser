<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEDOX Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Bar: Tabs & Window Drag Area -->
  <header class="app-header">
    <div class="logo-mark" title="ZEDOX Browser (Click for About)">
      <img src="assets/logo.png" class="header-logo-img" alt="ZEDOX Logo">
      <span class="logo-text">ZEDOX</span>
    </div>

    <div class="tabs-container" id="tabs-bar">
      <!-- Tabs rendered dynamically -->
    </div>

    <button class="icon-btn add-tab-btn" id="add-tab-btn" title="New Tab (Ctrl+T)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <div class="header-drag-region"></div>
  </header>

  <!-- Navigation & Smart Omnibar -->
  <nav class="nav-bar">
    <div class="nav-controls">
      <button class="icon-btn" id="btn-back" title="Back" disabled>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button class="icon-btn" id="btn-forward" title="Forward" disabled>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
      <button class="icon-btn" id="btn-reload" title="Reload (Ctrl+R)">
        <svg id="reload-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button class="icon-btn" id="btn-home" title="Home">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
    </div>

    <!-- Smart URL / Search Omnibar -->
    <div class="url-bar-container">
      <div class="security-indicator" id="security-icon" title="RAM-Only Privacy Mode Active">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="#10b981"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span class="security-text">Isolated</span>
      </div>

      <input type="text" id="url-input" placeholder="Search privately with DuckDuckGo or enter URL..." autocomplete="off" spellcheck="false">

      <div class="omnibar-actions">
        <button class="icon-btn mini-btn" id="btn-copy-url" title="Copy Current URL">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>

    <!-- Shield & Session Controls -->
    <div class="shield-controls">
      <!-- Shield Pill Badge -->
      <button class="shield-badge active" id="shield-badge-btn" title="ZEDOX Shield: Click to inspect blocked threats">
        <span class="shield-icon-wrapper">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#00f2fe"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        </span>
        <span id="shield-count">0</span>
        <span class="shield-tag">SHIELD</span>
      </button>

      <!-- Panic / Obliterate Session Button -->
      <button class="icon-btn danger-btn" id="btn-nuke" title="Panic Wipe (Instantly destroy all in-memory cookies & cache)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="#f43f5e"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      </button>
    </div>
  </nav>

  <!-- Realtime Web Page Loading Bar -->
  <div class="page-progress-bar" id="page-progress-bar"></div>

  <!-- Shield Flyout Popover -->
  <div class="shield-popover hidden" id="shield-popover">
    <div class="shield-popover-header">
      <div class="shield-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#00f2fe"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <strong>ZEDOX Shield</strong>
      </div>
      <span class="status-pill">ACTIVE & GUARDING</span>
    </div>

    <div class="shield-metric-grid">
      <div class="metric-box">
        <div class="metric-number" id="popover-shield-count">0</div>
        <div class="metric-label">Ads & Trackers Blocked</div>
      </div>
      <div class="metric-box">
        <div class="metric-number" id="popover-data-saved">0 MB</div>
        <div class="metric-label">Bandwidth Saved</div>
      </div>
    </div>

    <div class="shield-features-list">
      <div class="feature-item"><span class="check">✓</span> YouTube In-Stream Video Ad Skipper</div>
      <div class="feature-item"><span class="check">✓</span> Sponsored Sidebar & Banner Cleaner</div>
      <div class="feature-item"><span class="check">✓</span> 100% Ephemeral RAM Cookies</div>
      <div class="feature-item"><span class="check">✓</span> Zero History Logging</div>
      <div class="feature-item"><span class="check">✓</span> Global Privacy Control (`Sec-GPC`)</div>
    </div>

    <button class="popover-btn" id="popover-wipe-btn">Wipe Session & Cookies Now</button>
  </div>

  <!-- Main Webview Viewport Area -->
  <main class="webviews-container" id="webviews-container">
    <!-- Active webview tags and Start screens managed here dynamically -->
  </main>

  <script src="renderer.js"></script>
</body>
</html>
