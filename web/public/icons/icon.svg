<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Emblem with Glow -->
  <g transform="translate(106, 86) scale(12.5)" filter="url(#glow)">
    <path fill="url(#shieldGrad)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
  </g>
</svg>
